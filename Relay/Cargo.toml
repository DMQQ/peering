[package]
name = "peeringd"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
rand = "0.9.5"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
# `ring` rather than rustls's default `aws-lc-rs`, and the reason is deployment rather than
# anything this code does. `aws-lc-rs` builds a large C library through CMake and Perl, which on a
# small VPS is slow, needs build tools installed, and is the usual reason a cross-compile fails.
# `ring` builds from a C compiler and the musl headers and nothing else.
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }
