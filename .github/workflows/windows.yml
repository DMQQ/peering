# Tests the Windows host, builds the unsigned installer, and on a windows-v* tag publishes it as a release.
#
# The logic crates have no Windows API dependency, so they are tested on Linux where runs are cheap. The Windows job builds
# everything, including the host binary and the Windows API adapters, which cannot be compiled on another OS.
# The protocol vectors in docs/protocol/vectors are inputs to the tests, so a change to them triggers this workflow too.

name: windows

on:
  push:
    branches: [main, monorepo]
    tags: ["windows-v*"]
    paths:
      - "windows/**"
      - "docs/protocol/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "docs/protocol/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  logic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo clippy --locked -p peering-wire -p peering-core -p peering-agent -p peering-net --all-targets
      - run: cargo test --locked -p peering-wire -p peering-core -p peering-agent -p peering-net

  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: cargo test --locked -p peering-host --features terminal-hooks
      - run: cargo build --locked --release -p peering-host
      - name: Install Inno Setup when the runner image lacks it
        shell: pwsh
        run: |
          $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $found) { choco install innosetup --no-progress -y }
      - name: Build the unsigned installer
        shell: pwsh
        run: ./installer/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: peering-host-windows
          path: |
            windows/target/release/peering-host.exe
            windows/dist/PeeringHostSetup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: [logic, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: peering-host-windows
          path: out
      - name: Attach the unsigned installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/dist/PeeringHostSetup.exe out/target/release/peering-host.exe \
            --repo "${{ github.repository }}" \
            --title "Peering Host for Windows ${{ github.ref_name }}" \
            --notes "Unsigned build. Windows SmartScreen shows a warning on first run. Choose More info, then Run anyway."
