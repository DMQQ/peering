# Publishes the unsigned Windows installer when a windows-v* tag is pushed. The tag is the only trigger here and has no paths
# filter, so a release tag always runs, whichever files its commit touched. The build and the checks are windows.yml, called
# with the tag so the installer carries the tag's version.

name: windows-release

on:
  push:
    tags: ["windows-v*"]

jobs:
  checks:
    uses: ./.github/workflows/windows.yml
    with:
      release_tag: ${{ github.ref_name }}

  release:
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: peering-host-windows
          path: out
      - name: Attach the unsigned installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/dist/PeeringHostSetup.exe out/target/release/peering-host.exe \
            --repo "${{ github.repository }}" \
            --title "Peering Host for Windows ${{ github.ref_name }}" \
            --notes "Unsigned build. Windows SmartScreen shows a warning on first run. Choose More info, then Run anyway."
