# Builds the Android app and runs the pure Kotlin test suites.
#
# The logic lives in core:wire and core:session, which have no Android classes, so most of the suite runs on the plain JVM.
# The protocol vectors in docs/protocol/vectors are inputs to those tests, so a change to them triggers this workflow too.

name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "docs/protocol/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "docs/protocol/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Logic tests on the JVM
        run: ./gradlew :core:wire:test :core:session:test --no-daemon
      - name: Platform tests and the debug build
        run: ./gradlew :core:platform:testDebugUnitTest :app:assembleDebug --no-daemon
