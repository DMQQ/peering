[package]
name = "peering-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
peering-wire = { path = "../peering-wire" }
peering-core = { path = "../peering-core" }
thiserror.workspace = true
zeroize = "1"
png = { version = "0.17", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Shutdown", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Power", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
portable-pty = "0.9"
