[package]
name = "peering-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "peering-host"
path = "src/main.rs"

[dependencies]
peering-wire = { path = "../crates/peering-wire" }
peering-core = { path = "../crates/peering-core" }
peering-net = { path = "../crates/peering-net" }
peering-platform = { path = "../crates/peering-platform" }
peering-agent = { path = "../crates/peering-agent" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
webpki-roots = "1"
qrcode = "0.14"

[target.'cfg(windows)'.dependencies]
eframe = "0.31"
tray-icon = "0.21"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
peering-core = { path = "../crates/peering-core", features = ["testing"] }
